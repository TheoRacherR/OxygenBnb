services:
  app:
    container_name: reactapp-oxygen
    build: 
      context: ./front/oxygenbnb
      dockerfile: Dockerfile
      target: DEV_IMAGE
    volumes:
      - pgdata:/app
    ports:
      - 5173:5173
    environment:
      - CHOKIDAR_USEPOLLING=${NODE_ENV_DEV}
    networks:
        - front
    restart: always
    stdin_open: true
    tty: true
    
  nestapp:
    # user: node
    image: nestimg
    build:
      context: ./back/oxygenbnb
      dockerfile: Dockerfile
    ports:
    #   - ${NEST_PORT}:${NEST_PORT}
      - "3000:3000"
    environment:
      - DB_TYPE=${DB_TYPE}
      - PG_HOST=${PG_HOST} #doit matcher avec le container_name de la db
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
      - PG_PORT=${PG_PORT}
      - NODE_ENV_DEV=${NODE_ENV_DEV}
    restart: always
    # tty: true
    # stdin_open: true
    networks:
      - front
      - back
    volumes:
      - pgdata:/home/node
    command: sh -c "npm install && npm run start:dev"

  db:
    container_name: db-oxygen
    image: postgres:16
    ports:
      - ${PG_PORT}:${PG_PORT}
    environment:
      - POSTGRES_USER=${PG_USER} #doit matcher avec PG_USER
      - POSTGRES_PASSWORD=${PG_PASSWORD} #doit matcher avec PG_PASSWORD
      - POSTGRES_DB=${PG_DB} #doit matcher avec PG_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back

volumes:
  pgdata: {}

networks:
  front:
    driver: bridge
  back:
    driver: bridge